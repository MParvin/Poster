name: Build Go Binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*' # e.g., v1.0.0, v1.2.3
  pull_request:
    branches:
      - main

jobs:
  build-linux-arm64:
    name: Build for Linux ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Should match project's Go version

      - name: Build
        env:
          GOOS: linux
          GOARCH: arm64
        run: go build -v -o social-poster-linux-arm64 main.go

      - name: Upload Linux ARM64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: social-poster-linux-arm64
          path: social-poster-linux-arm64
          if-no-files-found: error # Fail the workflow if the binary is not found

  build-macos-arm64:
    name: Build for macOS ARM64 (Apple Silicon)
    runs-on: macos-latest # Standard macos-latest runners are x86_64, but can cross-compile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Should match project's Go version

      - name: Build
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go build -v -o social-poster-darwin-arm64 main.go

      - name: Upload macOS ARM64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: social-poster-darwin-arm64
          path: social-poster-darwin-arm64
          if-no-files-found: error # Fail the workflow if the binary is not found

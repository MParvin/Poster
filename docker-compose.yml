services:
  social_poster:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Use a reachable mirror when docker.io is slow/blocked:
        GO_IMAGE: focker.ir/golang:1.26.2-alpine3.22
        RUNTIME_IMAGE: alpine:3.24
        ALPINE_MIRROR: https://mirror.arvancloud.ir/alpine
        GOPROXY: https://goproxy.io,https://proxy.golang.org,direct
    container_name: social_poster_app
    env_file:
      - .env
    environment:
      POSTS_REPO_PATH: /app/my_posts_data
      STATE_FILE_PATH: /app/my_posts_data/.social_poster_state
      DELIVERIES_FILE_PATH: /app/my_posts_data/.social_poster_deliveries.json
      PROCESS_INTERVAL: ${PROCESS_INTERVAL:-5m}
    volumes:
      - posts_data:/app/my_posts_data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:exec,nosuid,size=64m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

volumes:
  posts_data:
    driver: local
